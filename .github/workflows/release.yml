name: release
# Push a version tag (made by `node scripts/release.mjs <version>`) to publish:
#   git push origin main v0.3.0
# This builds signed installers for Windows and macOS, attaches them to a
# GitHub Release with the changelog notes, and publishes latest.json, which the
# installed apps check to offer the update. The release stays a draft until
# every platform has built, so apps never see a half-finished one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(node scripts/release.mjs --check | sed 's/^versions agree: //')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but the version is $v"; exit 1
          fi
      - name: Draft release with the changelog notes
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs --notes "${GITHUB_REF_NAME#v}" > notes.md
          if [ ! -s notes.md ]; then echo "::error::No CHANGELOG.md section for ${GITHUB_REF_NAME#v}"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "Stagewright ${GITHUB_REF_NAME#v}" --notes-file notes.md
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            args: ""
            targets: ""
          - os: macos-latest
            # One app for Apple silicon and Intel Macs.
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - name: Check the signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings → Secrets and variables → Actions)"; exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # The app updates itself with the -setup.exe installer, as it was installed.
          updaterJsonPreferNsis: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (installed apps see it from now on)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | tee assets.txt
          grep -qx latest.json assets.txt || { echo "::error::latest.json missing"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
