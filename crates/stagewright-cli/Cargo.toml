[package]
name = "stagewright"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
stagewright-api = { path = "../stagewright-api" }
stagewright-core = { path = "../stagewright-core" }
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"
yrs = { version = "0.28", features = ["sync"] }
