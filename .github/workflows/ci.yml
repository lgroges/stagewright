name: ci
on:
  push:
    branches: ["**"] # version tags run release.yml instead
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - name: Version numbers agree (Cargo, package.json, lockfiles)
        run: node scripts/release.mjs --check
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -q -p stagewright -- check fixtures/stage-sample

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Editor classifier matches the Rust parser
        run: |
          npm run parity
          git diff --exit-code src/lib/__fixtures__/classify.json
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: End-to-end (drafting, co-writing and screenplays in Chromium)
        run: |
          cargo build -p stagewright
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run e2e
          npm run e2e:cowrite
          npm run e2e:screen
          npm run e2e:update
          npm run e2e:cast
          npm run e2e:check
          npm run e2e:layout
          npm run e2e:comments
          npm run e2e:ai

  desktop:
    # Test builds of the installers as downloadable artifacts: Windows (.msi and
    # -setup.exe) and macOS (.dmg, unsigned). Releases (with self-update) are
    # built by release.yml when a version tag is pushed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: stagewright-windows
            files: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: stagewright-macos
            files: |
              target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      # Unsigned for updates: only release builds carry the signing key.
      - run: npx tauri build --config src-tauri/tauri.ci.conf.json
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
