name: release
# Two ways to publish the version in Cargo.toml (set by
# `node scripts/release.mjs <version>`):
#   - Actions → release → Run workflow (on main); the tag is made for you, or
#   - push the tag: git push origin main v0.3.0
# This builds signed installers for Windows and macOS, attaches them to a
# GitHub Release with the changelog notes, and publishes latest.json, which the
# installed apps check to offer the update. The release stays a draft until
# every platform has built, so apps never see a half-finished one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - name: Version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node scripts/release.mjs --check | sed 's/^versions agree: //')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but the version is $v"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Run the release from main"; exit 1
          fi
          if [ "$(gh release view "v$v" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
            echo "::error::v$v is already released. Bump the version first: node scripts/release.mjs <version>"; exit 1
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Draft release with the changelog notes
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node scripts/release.mjs --notes "${TAG#v}" > notes.md
          if [ ! -s notes.md ]; then echo "::error::No CHANGELOG.md section for ${TAG#v}"; exit 1; fi
          # A draft's tag is created on this commit when the release is published.
          # A draft left by a failed run is reused, moved to this commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Stagewright ${TAG#v}" --notes-file notes.md
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"
          { echo 'notes<<NOTES_EOF'; cat notes.md; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            args: ""
            targets: ""
          - os: macos-latest
            # One app for Apple silicon and Intel Macs.
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - name: Signing key (whitespace from pasting removed)
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings → Secrets and variables → Actions)"; exit 1
          fi
          echo "::add-mask::$key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Becomes the "What's new" in the app's update prompt (latest.json notes).
          releaseBody: ${{ needs.prepare.outputs.notes }}
          args: ${{ matrix.args }}
          # The app updates itself with the -setup.exe installer, as it was installed.
          updaterJsonPreferNsis: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (installed apps see it from now on)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | tee assets.txt
          grep -qx latest.json assets.txt || { echo "::error::latest.json missing"; exit 1; }
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
