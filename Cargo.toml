[workspace]
resolver = "2"
members = ["crates/stagewright-core", "crates/stagewright-cli", "crates/stagewright-api", "app/src-tauri"]
# The desktop app needs WebView system libraries; plain `cargo build/test` skips it.
default-members = ["crates/stagewright-core", "crates/stagewright-cli", "crates/stagewright-api"]

[workspace.package]
edition = "2021"
# The one version number for every crate and the desktop app.
# Change it with `node scripts/release.mjs <version>`, not by hand.
version = "0.8.0"
license = "UNLICENSED"

# The grammar checker (harper-core and its dependencies) is slow unoptimised:
# seconds to start. Optimise dependencies even in dev builds; our crates stay quick to build.
[profile.dev.package."*"]
opt-level = 2
